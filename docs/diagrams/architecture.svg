<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="1040" height="740" fill="#14161a"/>

  <text x="40" y="44" fill="#e6e8eb" font-size="24" font-weight="600">Architecture — separate tools talking over APIs</text>
  <text x="40" y="68" fill="#8a8f9a" font-size="13">One application from your side. Independent processes underneath, so features can be added without entangling.</text>

  <!-- FRONTEND -->
  <rect x="40" y="92" width="960" height="104" rx="8" fill="#1c1f26" stroke="#4f9dff" stroke-width="1.5"/>
  <text x="60" y="120" fill="#4f9dff" font-size="13" font-weight="600">BROWSER · webview/app/</text>
  <text x="290" y="120" fill="#8a8f9a" font-size="11.5">static HTML + Three.js — never simulates or tests anything itself</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="60"  y="134" width="176" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="148" y="152" fill="#e6e8eb" font-weight="600">3D board</text><text x="148" y="168" fill="#8a8f9a" font-size="9.5">real GLB from KiCad</text>
    <rect x="248" y="134" width="176" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="336" y="152" fill="#e6e8eb" font-weight="600">Dashboard</text><text x="336" y="168" fill="#8a8f9a" font-size="9.5">inputs / outputs + icons</text>
    <rect x="436" y="134" width="176" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="524" y="152" fill="#e6e8eb" font-weight="600">Activity feed</text><text x="524" y="168" fill="#8a8f9a" font-size="9.5">"Pressed RST → Magnet 3 ON"</text>
    <rect x="624" y="134" width="176" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="712" y="152" fill="#e6e8eb" font-weight="600">Output console</text><text x="712" y="168" fill="#8a8f9a" font-size="9.5">reports + run history</text>
    <rect x="812" y="134" width="168" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="896" y="152" fill="#e6e8eb" font-weight="600">Start / Stop sim</text><text x="896" y="168" fill="#8a8f9a" font-size="9.5">+ time limit &amp; quota</text>
  </g>

  <path d="M520 196 L520 236" stroke="#4f9dff" stroke-width="2" marker-end="url(#a1)"/>
  <text x="532" y="220" fill="#4f9dff" font-size="11" font-family="monospace">HTTP · 127.0.0.1:8787</text>

  <!-- CORE -->
  <rect x="40" y="240" width="960" height="132" rx="8" fill="#1c1f26" stroke="#4caf7a" stroke-width="1.5"/>
  <text x="60" y="268" fill="#4caf7a" font-size="13" font-weight="600">CORE BACKEND · webview/server/</text>
  <text x="340" y="268" fill="#8a8f9a" font-size="11.5">stdlib Python, localhost only — deliberately small, and should stay that way</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="60"  y="282" width="222" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="171" y="300" fill="#e6e8eb" font-weight="600">Static files</text><text x="171" y="316" fill="#8a8f9a" font-size="9.5">app/ + model.glb (no-store)</text>
    <rect x="294" y="282" width="222" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="405" y="300" fill="#e6e8eb" font-weight="600">Project registry</text><text x="405" y="316" fill="#8a8f9a" font-size="9.5">manifest.json per project</text>
    <rect x="528" y="282" width="222" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="639" y="300" fill="#e6e8eb" font-weight="600">Declared actions</text><text x="639" y="316" fill="#8a8f9a" font-size="9.5">only what the manifest lists</text>
    <rect x="762" y="282" width="218" height="44" rx="5" fill="#14161a" stroke="#2c2f38"/>
    <text x="871" y="300" fill="#e6e8eb" font-weight="600">Wokwi bridge</text><text x="871" y="316" fill="#8a8f9a" font-size="9.5">+ quota / auto-stop timer</text>
  </g>
  <text x="60" y="352" fill="#ffcc33" font-size="11">Rule: if a new feature wants to edit server.py, it should almost certainly be a service instead →</text>

  <!-- BACKGROUND WORK -->
  <text x="40" y="392" fill="#8a8f9a" font-size="12" font-weight="600">BACKGROUND WORK — real tools, running as their own processes</text>

  <path d="M200 398 L200 408" stroke="#8a8f9a" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M520 398 L520 408" stroke="#8a8f9a" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M840 398 L840 408" stroke="#8a8f9a" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="40" y="412" width="300" height="150" rx="8" fill="#1c1f26" stroke="#2c2f38"/>
  <text x="190" y="438" fill="#e6e8eb" font-size="12.5" text-anchor="middle" font-weight="600">wokwi-cli mcp</text>
  <text x="190" y="456" fill="#8a8f9a" font-size="10.5" text-anchor="middle">subprocess · JSON-RPC over stdio</text>
  <rect x="58" y="468" width="264" height="80" rx="5" fill="#14161a" stroke="#2c2f38"/>
  <text x="190" y="488" fill="#ffcc33" font-size="11" text-anchor="middle" font-weight="600">runs your REAL firmware</text>
  <text x="190" y="506" fill="#8a8f9a" font-size="10" text-anchor="middle">real AVR emulation of firmware.elf</text>
  <text x="190" y="522" fill="#8a8f9a" font-size="10" text-anchor="middle">set_control = press · read_pin = outputs</text>
  <text x="190" y="538" fill="#e0605a" font-size="10" text-anchor="middle">spends metered quota while running</text>

  <rect x="370" y="412" width="300" height="150" rx="8" fill="#1c1f26" stroke="#2c2f38"/>
  <text x="520" y="438" fill="#e6e8eb" font-size="12.5" text-anchor="middle" font-weight="600">Action subprocesses</text>
  <text x="520" y="456" fill="#8a8f9a" font-size="10.5" text-anchor="middle">scripts + report files the project declares</text>
  <rect x="388" y="468" width="264" height="80" rx="5" fill="#14161a" stroke="#2c2f38"/>
  <text x="520" y="488" fill="#e6e8eb" font-size="10.5" text-anchor="middle">test/pinmap.py — code vs board</text>
  <text x="520" y="506" fill="#e6e8eb" font-size="10.5" text-anchor="middle">electrical / SPICE / Wokwi reports</text>
  <text x="520" y="528" fill="#8a8f9a" font-size="10" text-anchor="middle">never an arbitrary command</text>
  <text x="520" y="543" fill="#8a8f9a" font-size="10" text-anchor="middle">from the browser</text>

  <rect x="700" y="412" width="300" height="150" rx="8" fill="#1c1f26" stroke="#4f9dff"/>
  <text x="850" y="438" fill="#4f9dff" font-size="12.5" text-anchor="middle" font-weight="600">Services (how we grow)</text>
  <text x="850" y="456" fill="#8a8f9a" font-size="10.5" text-anchor="middle">/api/services/&lt;name&gt;/* → own port</text>
  <rect x="718" y="468" width="264" height="80" rx="5" fill="#14161a" stroke="#2c2f38"/>
  <text x="850" y="487" fill="#4caf7a" font-size="10.5" text-anchor="middle">echo — working reference (copy it)</text>
  <text x="850" y="506" fill="#8a8f9a" font-size="10.5" text-anchor="middle">future: SPICE · DRC · BOM pricing</text>
  <text x="850" y="523" fill="#8a8f9a" font-size="10.5" text-anchor="middle">design review · firmware builder</text>
  <text x="850" y="541" fill="#8a8f9a" font-size="10" text-anchor="middle">each its own process + API</text>

  <!-- KEY IDEA -->
  <rect x="40" y="580" width="960" height="92" rx="8" fill="#1c1f26" stroke="#2c2f38"/>
  <text x="60" y="606" fill="#e6e8eb" font-size="13" font-weight="600">Why it scales</text>
  <text x="60" y="628" fill="#8a8f9a" font-size="11.5">A service can crash, restart, or be rewritten in another language and nothing else notices. The core only knows WHERE it lives, never WHAT it does.</text>
  <text x="60" y="648" fill="#8a8f9a" font-size="11.5">Adding a project or a capability must never require editing server/ or app/. If it does, that's a bug in the design — fix the generator or add a service.</text>
  <text x="60" y="666" fill="#8a8f9a" font-size="11.5">Proven: KiCad's own pic_programmer demo was onboarded with zero core changes.</text>

  <text x="40" y="706" fill="#8a8f9a" font-size="11">Full endpoint + background-work reference: webview/API.md</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f9dff"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8a8f9a"/></marker>
  </defs>
</svg>
